{{- $description := .Params.summary_text | default .Site.Params.description | default "希路路克的个人网站：正在做的，正在想的。" -}}
{{- $socialImage := "images/seedraft-project.png" | absURL -}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfcf8">
<title>{{ if .IsHome }}希路路克{{ else }}{{ .Title }} · 希路路克{{ end }}</title>
<meta name="description" content="{{ $description | plainify | truncate 160 }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:site_name" content="LuxiBlog">
<meta property="og:title" content="{{ if .IsHome }}希路路克 · 正在做的，正在想的{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ $description | plainify | truncate 160 }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="{{ if eq .Type "post" }}article{{ else }}website{{ end }}">
<meta property="og:image" content="{{ $socialImage }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ "favicon.ico" | relURL }}">
<link rel="stylesheet" href="{{ "tokens.css" | relURL }}">
<link rel="stylesheet" href="{{ "main.css" | relURL }}">
<link rel="stylesheet" href="{{ "_jant/client-site.css" | relURL }}">
<link rel="stylesheet" href="{{ "theme.css" | relURL }}">
<link rel="stylesheet" href="{{ "custom.css" | relURL }}">
<link rel="stylesheet" href="{{ "editorial.css" | relURL }}">
<script type="module" src="{{ "_jant/client-site.js" | relURL }}"></script>
